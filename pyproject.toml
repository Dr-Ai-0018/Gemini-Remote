[project]
name = "gemini-remote"
version = "0.1.4"
description = "Hand MCP tasks to a logged-in Gemini web page in your own browser and collect results asynchronously"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
  "mcp>=1.26,<2",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.15.1,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
gemini-remote = "gemini_remote.cli.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_remote"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Starlette's TestClient nags about httpx2; the test client itself works unchanged.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
